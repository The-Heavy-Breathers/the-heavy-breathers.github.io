<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8f2e8">
  <meta name="description" content="A little hello from the Heavy Breathers.">
  <title>The Heavy Breathers</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183029;
      --accent: #d75b42;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 1.5rem;
      place-items: center;
      background: radial-gradient(ellipse at 50% 44%, #f8fbf6 0%, #e8f2e8 54%, #dcebe3 100%);
      color: var(--ink);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 4.5rem;
      font-weight: 500;
      line-height: 1;
      text-align: center;
    }

    .period {
      color: var(--accent);
    }

    @media (max-width: 36rem) {
      h1 {
        font-size: 2.75rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="greeting">Hello, world<span class="period">.</span></h1>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.2/gsap.min.js"></script>
  <script>
    if (window.gsap && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      gsap.from(".greeting", {
        y: 8,
        autoAlpha: 0,
        duration: 0.55,
        ease: "power2.out"
      });
    }
  </script>
</body>
</html>
